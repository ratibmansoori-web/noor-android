name: Build Noor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 1. Install packages
        run: npm install --no-audit --no-fund

      - name: 2. Download the live Noor web app
        run: node build.mjs web

      - name: 3. Create the Android project
        run: npx cap add android

      - name: 4. Add icon, azan sound and permissions
        run: node build.mjs android

      - name: 5. Copy web files into Android
        run: npx cap sync android

      - name: 6. Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
